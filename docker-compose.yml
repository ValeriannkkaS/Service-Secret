services:
  secret-backend:
    container_name: secret-backend
    build:
      context: ./secret-backend
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    env_file:
      - ./secret-backend/.env.production
    depends_on:
      - postgres
    command: >
      sh -c "npm run migrate up && node dist/main"

  postgres:
    image: postgres:17
    container_name: secret-postgres-db-prod
    restart: always
    ports:
      - 6543:5432
    volumes:
      - secret_service_postgres_data:/var/lib/postgresql/data1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

volumes:
  secret_service_postgres_data: